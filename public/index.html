<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KHQR Payment Test</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 { font-size: 20px; color: #1a1a1a; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 24px; }

    .amount-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="number"] {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border 0.2s;
    }
    input[type="number"]:focus { border-color: #3b5bdb; }

    button {
      padding: 12px 24px;
      background: #3b5bdb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover { background: #2f4ac7; }
    button:disabled { background: #aaa; cursor: not-allowed; }

    /* Screens */
    .screen { display: none; }
    .screen.active { display: block; }

    /* QR screen */
    #qr-canvas {
      margin: 20px auto;
      display: block;
    }

    .amount-display {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .scan-hint {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: #888;
      margin-top: 16px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #f59f00;
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Success screen */
    .success-icon {
      width: 72px;
      height: 72px;
      background: #ebfbee;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 36px;
    }

    .success-title {
      font-size: 22px;
      font-weight: 700;
      color: #2f9e44;
      margin-bottom: 8px;
    }

    .success-detail {
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
    }

    /* Error */
    .error-msg {
      background: #fff5f5;
      color: #c92a2a;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Screen 1: Enter amount -->
  <div class="screen active" id="screen-pay">
    <h1>KHQR Payment Test</h1>
    <p class="subtitle">Enter amount to generate QR code</p>

    <div class="amount-row">
      <input type="number" id="amount-input" placeholder="Amount (USD)" min="0.01" step="0.01" value="1.00"/>
    </div>

    <button id="pay-btn" onclick="startPayment()">Generate QR</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- Screen 2: Show QR -->
  <div class="screen" id="screen-qr">
    <h1>Scan to Pay</h1>
    <p class="scan-hint">Open your banking app and scan this QR code</p>

    <div class="amount-display" id="amount-display">$0.00</div>

    <canvas id="qr-canvas"></canvas>

    <div class="status-row">
      <div class="dot"></div>
      <span>Waiting for payment...</span>
    </div>
  </div>

  <!-- Screen 3: Success -->
  <div class="screen" id="screen-success">
    <div class="success-icon">✓</div>
    <div class="success-title">Payment Successful!</div>
    <div class="success-detail" id="success-detail">Your payment has been received.</div>
    <button onclick="resetPage()">Make Another Payment</button>
  </div>

</div>

<script>
  // ---- IMPORTANT: Change this to your Vercel URL after deploying ----
  const API_BASE = window.location.origin;
  // If testing locally with vercel dev, keep as is.
  // After deploy it will be: https://your-app.vercel.app

  let pollInterval = null;
  let currentMd5 = null;
  let currentAmount = 0;

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function showError(msg) {
    const el = document.getElementById("error-msg");
    el.textContent = msg;
    el.style.display = "block";
  }

  function hideError() {
    document.getElementById("error-msg").style.display = "none";
  }

  async function startPayment() {
    hideError();
    const amount = parseFloat(document.getElementById("amount-input").value);

    if (!amount || amount <= 0) {
      showError("Please enter a valid amount.");
      return;
    }

    const btn = document.getElementById("pay-btn");
    btn.disabled = true;
    btn.textContent = "Generating...";

    try {
      const res = await fetch(`${API_BASE}/api/generate-qr`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount, merchantName: "Puthyon Chandara" }),
      });

      const data = await res.json();

      if (!res.ok || !data.qr) {
        throw new Error(data.error || "Failed to generate QR");
      }

      currentMd5 = data.md5;
      currentAmount = amount;

      // Show QR screen
      document.getElementById("amount-display").textContent = `$${amount.toFixed(2)}`;
      showScreen("screen-qr");

      // Draw QR code on canvas
      QRCode.toCanvas(
        document.getElementById("qr-canvas"),
        data.qr,
        { width: 240, margin: 2, color: { dark: "#000000", light: "#ffffff" } }
      );

      // Start polling every 3 seconds
      startPolling();

    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Generate QR";
    }
  }

  function startPolling() {
    if (pollInterval) clearInterval(pollInterval);

    pollInterval = setInterval(async () => {
      try {
        const res = await fetch(`${API_BASE}/api/check-payment?md5=${currentMd5}`);
        const data = await res.json();

        console.log("Poll result:", data);

        if (data.paid === true) {
          clearInterval(pollInterval);
          showSuccess();
        }

      } catch (err) {
        console.error("Polling error:", err);
        // Keep polling even if one request fails
      }
    }, 3000); // check every 3 seconds
  }

  function showSuccess() {
    document.getElementById("success-detail").textContent =
      `$${currentAmount.toFixed(2)} USD received successfully.`;
    showScreen("screen-success");
  }

  function resetPage() {
    if (pollInterval) clearInterval(pollInterval);
    currentMd5 = null;
    currentAmount = 0;
    document.getElementById("amount-input").value = "1.00";
    showScreen("screen-pay");
  }
</script>

</body>
</html>
